# Server-side periodic scheduler for the autonomous dispatch engine.
# Vercel Hobby only allows a DAILY cron, so this workflow calls the dispatch endpoint every 15 minutes.
# The endpoint itself decides whether a cycle is due (dispatch_settings.periodMinutes) and what it may do
# (mode off | observe | auto, scope) — this job only provides the clock. It never runs in a browser.
#
# Activation (requires the owner's approval — nothing runs until both secrets exist):
#   repository secrets  DISPATCH_URL  = https://<production-domain>/api/dispatch/run
#                       CRON_SECRET   = same value as the Vercel env var CRON_SECRET
name: dispatch-schedule
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: dispatch-schedule
  cancel-in-progress: false   # a slow cycle is never killed half-way; the next one waits
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one dispatch cycle (skips cleanly when not configured)
        env:
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DISPATCH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Dispatch schedule not configured (DISPATCH_URL / CRON_SECRET missing) — skipping."
            exit 0
          fi
          code=$(curl -s -o response.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$DISPATCH_URL")
          echo "HTTP $code"; head -c 600 response.json; echo
          test "$code" = "200"
